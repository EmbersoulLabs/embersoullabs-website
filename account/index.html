<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Account — EmberSoul Labs</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo-link" aria-label="EmberSoul Labs">
        <img src="/assets/logo-horizontal.png" alt="EmberSoul Labs" width="220" height="67">
      </a>
      <a class="btn btn-ghost" href="/account/orders/">My orders</a>
    </div>
  </header>
  <main class="legal-page">
    <div class="container form-page">
      <div class="promo-banner">
        <p class="promo-label">Account</p>
        <h1 id="account-title">Your account</h1>
        <p class="promo-offer" id="account-email">Checking your session…</p>
      </div>
      <p class="form-intro">Orders appear here only after you claim them with the access link from your payment page. An email address by itself does not reveal past orders.</p>
      <div class="hero-actions" style="justify-content:flex-start;">
        <a class="btn btn-primary" href="/account/orders/">View orders</a>
        <button class="btn btn-ghost" id="logout" type="button">Log out</button>
      </div>
    </div>
  </main>
  <script>
    fetch("/api/auth/session", { credentials: "same-origin", cache: "no-store" })
      .then(function (response) { return response.json().then(function (data) { return { status: response.status, data: data }; }); })
      .then(function (result) {
        if (result.status !== 200) {
          window.location.replace("/login/?next=" + encodeURIComponent("/account/"));
          return;
        }
        document.getElementById("account-email").textContent = result.data.email;
      });
    document.getElementById("logout").addEventListener("click", function () {
      fetch("/api/auth/logout", { method: "POST", credentials: "same-origin" })
        .then(function () { window.location.replace("/login/"); });
    });
  </script>
</body>
</html>
