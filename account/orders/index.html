<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>My Orders — EmberSoul Labs</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/style.css?v=20261011c">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo-link" aria-label="EmberSoul Labs">
        <img src="/assets/logo-horizontal.png" alt="EmberSoul Labs" width="220" height="67">
      </a>
    </div>
  </header>
  <main class="legal-page">
    <div class="container">
      <div class="promo-banner">
        <p class="promo-label">My Orders</p>
        <h1>Your AI ad orders</h1>
        <p class="promo-offer">Payment, creative brief, and production progress for orders linked to this login.</p>
      </div>
      <p id="claim-note" class="form-intro" hidden></p>
      <section id="signed-out" class="portal-card" hidden>
        <h2>Sign in to see your orders</h2>
        <p class="form-intro">Orders stay private until login succeeds. An email address by itself does not list past payments.</p>
        <a class="btn btn-primary" id="login-link" href="/login/?next=%2Faccount%2Forders%2F">Login</a>
      </section>
      <div id="signed-in" hidden>
        <form id="filters" class="portal-filters">
          <label>Payment
            <select name="payment">
              <option value="">All</option>
              <option value="PAID">Payment received</option>
              <option value="READY_FOR_PRODUCTION">Ready to produce</option>
              <option value="CREATED">Waiting for payment</option>
            </select>
          </label>
          <label>Production
            <select name="progress">
              <option value="">All</option>
              <option value="PAID">Paid</option>
              <option value="BRIEF_RECEIVED">Brief received</option>
              <option value="IN_PRODUCTION">In production</option>
              <option value="REVIEW">In review</option>
              <option value="DELIVERED">Delivered</option>
            </select>
          </label>
        </form>
        <p id="orders-state" class="form-intro">Loading your orders…</p>
        <div id="orders" class="portal-list"></div>
      </div>
    </div>
  </main>
  <script src="/js/order-copy.js?v=20261011b" defer></script>
  <script src="/js/site-nav.js?v=20261011b" defer></script>
  <script type="module">
    (function () {
      var params = new URLSearchParams(window.location.search);
      var note = document.getElementById("claim-note");
      var list = document.getElementById("orders");
      var filters = document.getElementById("filters");
      var state = document.getElementById("orders-state");
      var signedOut = document.getElementById("signed-out");
      var signedIn = document.getElementById("signed-in");
      function text(value) {
        return window.EmberOrderCopy.label(value);
      }
      function showSignedOut() {
        signedIn.hidden = true;
        signedOut.hidden = false;
        list.replaceChildren();
      }
      function load() {
        state.hidden = false;
        state.textContent = "Loading your orders…";
        list.replaceChildren();
        var query = new URLSearchParams(new FormData(filters));
        if (!query.get("payment")) query.delete("payment");
        if (!query.get("progress")) query.delete("progress");
        fetch("/api/account/orders/?" + query.toString(), { credentials: "same-origin", cache: "no-store" })
          .then(function (response) { return response.json().then(function (data) { return { status: response.status, data: data }; }); })
          .then(function (result) {
            if (result.status === 401) {
              showSignedOut();
              return;
            }
            if (!result.data || result.data.ok === false) {
              state.textContent = "We couldn't load your orders. Refresh and try again.";
              return;
            }
            signedOut.hidden = true;
            signedIn.hidden = false;
            var orders = result.data.orders || [];
            if (!orders.length) {
              state.textContent = "No orders are linked to this login yet. After checkout, open the payment confirmation while signed in.";
              return;
            }
            state.hidden = true;
            orders.forEach(function (order) {
              var card = document.createElement("article");
              card.className = "portal-card order-card";
              var title = document.createElement("strong");
              title.textContent = order.package || "AI ad";
              var amount = document.createElement("p");
              amount.className = "order-meta";
              amount.textContent = order.amount_display || "";
              var payment = document.createElement("p");
              payment.textContent = "Payment: " + text(order.payment_status);
              var brief = document.createElement("p");
              brief.textContent = "Creative brief: " + text(order.brief_status);
              var progress = document.createElement("p");
              progress.textContent = "Production: " + text(order.workflow_status || order.payment_status);
              var link = document.createElement("a");
              link.className = "btn btn-primary";
              link.href = "/account/orders/" + encodeURIComponent(order.reference) + "/";
              link.textContent = order.brief_status === "missing" && order.payment_status === "PAID"
                ? "Complete your creative brief"
                : "View order details";
              card.append(title, amount, payment, brief, progress, link);
              list.appendChild(card);
            });
          })
          .catch(function () {
            signedIn.hidden = false;
            state.textContent = "We couldn't load your orders. Refresh and try again.";
          });
      }
      function claimThenLoad() {
        var sessionId = params.get("session_id");
        var token = params.get("access_token");
        if (!sessionId || !token) { load(); return; }
        history.replaceState({}, "", "/account/orders/");
        fetch("/api/account/orders/", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, access_token: token })
        }).then(function (response) { return response.json().then(function (data) { return { status: response.status, data: data }; }); })
          .then(function (result) {
            if (result.status === 401) {
              var back = "/account/orders/?session_id=" + encodeURIComponent(sessionId) + "&access_token=" + encodeURIComponent(token);
              window.location.replace("/login/?next=" + encodeURIComponent(back));
              return;
            }
            note.hidden = false;
            note.textContent = result.data && result.data.ok ? "This order is now linked to your login." : "That payment link could not be claimed.";
            load();
          })
          .catch(function () {
            note.hidden = false;
            note.textContent = "We couldn't link that payment. Try the confirmation link again.";
            load();
          });
      }
      filters.addEventListener("change", load);
      claimThenLoad();
    })();
  </script>
</body>
</html>
