<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
<script>
(function () {
  var key = "es-appearance";
  var pref = "light";
  try {
    var saved = localStorage.getItem(key);
    if (saved === "light" || saved === "dark" || saved === "auto") pref = saved;
  } catch (err) {}
  var dark = false;
  try { dark = window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (err) {}
  var theme = pref === "auto" ? (dark ? "dark" : "light") : pref;
  document.documentElement.setAttribute("data-theme", theme);
  document.documentElement.setAttribute("data-appearance", pref);
  document.documentElement.style.colorScheme = theme;
})();
</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout cancelled — EmberSoul Labs</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
  <link rel="stylesheet" href="/css/style.css?v=20261011d">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo-link" aria-label="EmberSoul Labs">
        <img src="/assets/logo-horizontal.png" alt="EmberSoul Labs" width="220" height="67">
      </a>
    </div>
  </header>

  <main class="legal-page">
    <div class="container form-page">
      <div class="promo-banner">
        <p class="promo-label">Checkout</p>
        <h1>
          <span class="lang-zh">付款未完成</span>
          <span class="lang-en">Payment was not completed</span>
        </h1>
        <p class="promo-offer">
          <span class="lang-zh">没有开始订单。你可以返回所选套餐重试，或改用询盘表单。</span>
          <span class="lang-en">No order has been started. You can return to your selected package and try again, or send an enquiry instead.</span>
        </p>
      </div>

      <div class="hero-actions" style="justify-content:flex-start;margin-top:1.5rem;">
        <a href="/#ai-ads" class="btn btn-primary" id="back-package">
          <span class="lang-zh">返回套餐</span>
          <span class="lang-en">Back to package</span>
        </a>
        <a href="/ai-ads/" class="btn btn-ghost" id="back-form">
          <span class="lang-zh">改走询盘</span>
          <span class="lang-en">Send enquiry instead</span>
        </a>
      </div>
    </div>
  </main>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var type = params.get("service");
      var region = params.get("region");
      var form = document.getElementById("back-form");
      var pack = document.getElementById("back-package");
      if (form) {
        var url = new URL("/ai-ads/", window.location.origin);
        if (type) url.searchParams.set("type", type);
        if (region) url.searchParams.set("region", region);
        form.setAttribute("href", url.pathname + url.search);
      }
      if (pack && type) {
        pack.setAttribute("href", "/#ai-ads");
      }
    })();
  </script>
  <script src="/js/site-nav.js?v=20261011d" defer></script>
</body>
</html>
